services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: camarote-sqlserver
    environment:
        - ACCEPT_EULA=Y
        - MSSQL_SA_PASSWORD=CamaroteSucesso123
    ports:
        - "1433:1433"
    volumes:
    - sqlserver_data:/var/opt/mssql


  rabbitmq:
    image: rabbitmq:3-management
    container_name: camarote-rabbitmq
    environment:
        - RABBITMQ_DEFAULT_USER=guest
        - RABBITMQ_DEFAULT_PASS=guest
    ports:
        - "5672:5672"
        - "15672:15672"
    volumes:
        - rabbitmq_data:/var/lib/rabbitmq

volumes:
  sqlserver_data:
  rabbitmq_data: